openapi: 3.1.0
info:
  title: Effort Tracker API
  version: 2.0.0
servers:
  - url: http://localhost:4000/api/v1
security:
  - projectCookie: []
paths:
  /health:
    get:
      security: []
      responses:
        '200': { description: Healthy }
  /projects:
    get:
      security: []
      responses:
        '200': { description: Public project directory }
    post:
      security: []
      responses:
        '201': { description: Project created and Admin cookie issued }
        '401': { description: Invalid application password }
  /projects/{projectId}/unlock:
    post:
      security: []
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200': { description: Team cookie issued }
        '401': { description: Invalid Team password }
  /projects/{projectId}/admin-mode:
    post:
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200': { description: Admin cookie issued }
        '401': { description: Invalid Admin password }
  /projects/{projectId}/snapshot:
    get:
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200': { description: Scoped project snapshot }
        '401': { $ref: '#/components/responses/Unauthorized' }
components:
  securitySchemes:
    projectCookie:
      type: apiKey
      in: cookie
      name: effort_project_session
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string }
  responses:
    Unauthorized: { description: Project password or valid session required }
    Forbidden: { description: Admin mode required }
